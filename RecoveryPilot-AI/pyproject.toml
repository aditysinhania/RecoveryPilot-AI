[project]
name = "recoverypilot-ai"
version = "0.1.0"
description = "RecoveryPilot AI — Razorpay AI Revenue Recovery monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "recoverypilot-backend",
    "recoverypilot-services",
    "recoverypilot-integrations",
    "recoverypilot-simulator",
    "recoverypilot-shared",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.uv.workspace]
members = [
    "apps/backend",
    "services",
    "integrations",
    "simulator",
    "shared",
]

[tool.uv.sources]
recoverypilot-backend = { workspace = true }
recoverypilot-services = { workspace = true }
recoverypilot-integrations = { workspace = true }
recoverypilot-simulator = { workspace = true }
recoverypilot-shared = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/backend", "services", "integrations", "simulator", "shared"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
