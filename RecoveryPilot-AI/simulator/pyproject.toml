[project]
name = "recoverypilot-simulator"
version = "0.1.0"
description = "Batch recovery simulator and evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "recoverypilot-services",
    "recoverypilot-shared",
    "faker>=37.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
recoverypilot-services = { workspace = true }
recoverypilot-shared = { workspace = true }
