[project]
name = "recoverypilot-simulator"
version = "0.1.0"
description = "Batch recovery simulator and evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "recoverypilot-services",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
recoverypilot-services = { workspace = true }
