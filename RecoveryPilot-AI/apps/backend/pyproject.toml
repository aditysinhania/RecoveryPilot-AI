[project]
name = "recoverypilot-backend"
version = "0.1.0"
description = "FastAPI application for RecoveryPilot AI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "recoverypilot-shared",
    "recoverypilot-services",
    "recoverypilot-integrations",
    "recoverypilot-simulator",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv.sources]
recoverypilot-shared = { workspace = true }
recoverypilot-services = { workspace = true }
recoverypilot-integrations = { workspace = true }
recoverypilot-simulator = { workspace = true }
