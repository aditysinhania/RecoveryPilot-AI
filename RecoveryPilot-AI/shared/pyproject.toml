[project]
name = "recoverypilot-shared"
version = "0.1.0"
description = "Shared types, constants, and utilities for RecoveryPilot AI"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
